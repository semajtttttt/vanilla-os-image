name: Custom Vanilla Gaming
id: custom-vanilla-gaming
vibversion: '1.0.7'

stages:
- id: build
  base: ghcr.io/vanilla-os/nvidia:main
  addincludes: true
  singlelayer: false
  labels:
    maintainer: self-maintained
  args:
    DEBIAN_FRONTEND: noninteractive

  runs:
    commands:
      - echo 'APT::Install-Recommends "1";' > /etc/apt/apt.conf.d/01norecommends
      - echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until

  modules:
  - name: init-setup
    type: shell
    commands:
    - lpkg --unlock
    - apt-get update

  # Custom gaming and desktop modules
  - name: setup-repositories
    type: shell
    commands:
      # Pin base VanillaOS repos to amd64 (the mirror lists i386 packages but the .deb pool is empty)
      - for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do [ -f "$f" ] && sed -i '/^deb [^[]/s/^deb /deb [arch=amd64] /' "$f"; done
      # Enable Debian non-free, contrib and non-free-firmware components
      - for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do [ -f "$f" ] && sed -i 's/main/main contrib non-free non-free-firmware/g' "$f"; done
      # Add Valve's official Steam repository (both amd64 and i386 for the runtime libs)
      - wget -q -O /usr/share/keyrings/steam.gpg "https://repo.steampowered.com/steam/archive/stable/steam.gpg"
      - echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/steam.gpg] https://repo.steampowered.com/steam/ stable steam' > /etc/apt/sources.list.d/steam.list
      # Fetch the same i386 .debs directly from snapshot.debian.org since the VanillaOS mirror is missing them
      - SNAPSHOT=$(grep -oE 'repo3\.vanillaos\.org/[0-9]{8}T[0-9]{6}Z' /etc/apt/sources.list | head -1 | cut -d/ -f2); [ -z "$SNAPSHOT" ] && SNAPSHOT=20251129T023004Z; echo "deb [arch=i386 trusted=yes] https://snapshot.debian.org/archive/debian/$SNAPSHOT sid main contrib non-free non-free-firmware" > /etc/apt/sources.list.d/i386-snapshot.list
      - dpkg --add-architecture i386
      # Install tools needed for downloading archives later
      - apt-get -o Acquire::Check-Valid-Until=false update && apt-get install -y wget

  - name: install-core-applications
    type: shell
    commands:
      - apt-get install -y docker.io docker-buildx docker-compose
      # Refresh package lists after adding the i386 snapshot so the steam-launcher candidate is picked up
      - apt-get -o Acquire::Check-Valid-Until=false update
      # Steam's 32-bit bootstrap needs 32-bit libc, GL and DRM libraries
      - apt-get -o Acquire::Check-Valid-Until=false install -y --no-install-recommends steam-launcher libc6:i386 libdrm2:i386 libstdc++6:i386 libgcc-s1:i386 || apt-get -o Acquire::Check-Valid-Until=false install -y --no-install-recommends steam-installer libc6:i386 libdrm2:i386 libstdc++6:i386 libgcc-s1:i386
      # Steam's 32-bit GL stack can't always be installed via apt because amd64/i386 versions get out of sync, so force-extract the i386 .debs
      - mkdir -p /tmp/gl-i386 && cd /tmp/gl-i386 && for pkg in libgl1 libglx0 libglvnd0 libglx-mesa0 libgl1-mesa-dri libglapi-mesa libgbm1 libdrm2 libx11-xcb1 libx11-6 libxcb1 libxcb-dri2-0 libxcb-dri3-0 libxcb-glx0 libxcb-present0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-server0 libexpat1 libzstd1 libvulkan1 libelf1 libelf1t64 libpciaccess0 libsensors5 libstdc++6 libgcc-s1; do apt-get -o Acquire::Check-Valid-Until=false download "${pkg}:i386" || true; done
      - for deb in /tmp/gl-i386/*.deb; do [ -f "$deb" ] && dpkg-deb -x "$deb" /; done
      - rm -rf /tmp/gl-i386
      - echo '/usr/lib/i386-linux-gnu' > /etc/ld.so.conf.d/i386-linux-gnu.conf
      - ldconfig
      - test -f /usr/lib/i386-linux-gnu/libGL.so.1

  - name: install-devin-desktop
    type: shell
    commands:
      # Fetch and install the latest Devin Desktop .deb from Codeium's update API
      - apt-get -o Acquire::Check-Valid-Until=false update
      - apt-get -o Acquire::Check-Valid-Until=false install -y jq
      - DEVIN_URL=$(wget -qO- "https://windsurf-stable.codeium.com/api/update/linux-x64/stable/latest" | jq -r '.url // .downloadUrl // empty')
      - test -n "$DEVIN_URL"
      - wget -nv --tries=5 --timeout=120 -O /tmp/devin-desktop.deb "$DEVIN_URL"
      - dpkg -i /tmp/devin-desktop.deb || true
      - apt-get -o Acquire::Check-Valid-Until=false -f -y install
      - rm -f /tmp/devin-desktop.deb

  - name: install-deb-packages
    type: includes
    includes:
      - modules/50-install-debs.yml

  - name: install-xpadneo
    type: shell
    commands:
      # Pull build tools and kernel headers for DKMS
      - apt-get install -y dkms linux-headers-amd64 build-essential
      # Fetch and unpack xpadneo
      - wget -nv --tries=5 --timeout=60 -O /tmp/xpadneo.tar.gz "https://codeload.github.com/atar-axis/xpadneo/tar.gz/refs/tags/v0.10.4"
      - mkdir -p /tmp/xpadneo
      - tar -xzf /tmp/xpadneo.tar.gz -C /tmp/xpadneo --strip-components=1
      # Generate dkms.conf, install modprobe/udev rules and docs, but skip dkms/udev in the Makefile
      - make -C /tmp/xpadneo install DKMS=true UDEVADM=true VERSION=v0.10.4
      # Stage the source tree for DKMS
      - mkdir -p /usr/src/hid-xpadneo-v0.10.4
      - cp -r /tmp/xpadneo/hid-xpadneo/* /usr/src/hid-xpadneo-v0.10.4/
      - dkms add -m hid-xpadneo -v v0.10.4
      # Build and install the module for the image's target kernel so it is baked in
      - KV=$(ls /lib/modules | sort -V | tail -1)
      - dkms build -m hid-xpadneo -v v0.10.4 -k "$KV"
      - dkms install -m hid-xpadneo -v v0.10.4 -k "$KV"
      - depmod -a "$KV"
      - rm -rf /tmp/xpadneo /tmp/xpadneo.tar.gz

  - name: configure-systemd-services
    type: shell
    commands:
      # Enable the Docker system daemon to launch automatically on boot
      - systemctl enable docker.service
      - systemctl enable containerd.service

  - name: install-gnome-extensions
    type: shell
    commands:
      # Install build dependencies for GNOME Shell extensions
      - apt-get update && apt-get install -y git unzip gettext meson ninja-build sassc libglib2.0-dev-bin jq libpulse0 libpulse-mainloop-glib0 libpulse-dev pulseaudio-utils libgsound0 libcanberra0 libcanberra-gtk3-0 libasound2
      - mkdir -p /usr/share/gnome-shell/extensions

      # 1. AppIndicator and KStatusNotifierItem Support
      - git clone "https://github.com/ubuntu/gnome-shell-extension-appindicator.git" /tmp/appindicator
      - cd /tmp/appindicator && meson setup _build . -Dlocal_install=disabled --prefix=/usr && ninja -C _build install

      # 2. ArcMenu
      - git clone "https://gitlab.com/arcmenu/ArcMenu.git" /tmp/arcmenu
      - cd /tmp/arcmenu && make install DESTDIR=/

      # 3. Caffeine
      - wget -nv --tries=5 --timeout=60 -O /tmp/caffeine.tar.gz "https://codeload.github.com/eonpatapon/gnome-shell-extension-caffeine/tar.gz/refs/heads/master"
      - mkdir -p /tmp/caffeine-src && tar -xzf /tmp/caffeine.tar.gz -C /tmp/caffeine-src --strip-components=1
      - cp -rT /tmp/caffeine-src/caffeine@patapon.info /usr/share/gnome-shell/extensions/caffeine@patapon.info

      # 4. Dash to Dock
      - git clone "https://github.com/micheleg/dash-to-dock.git" /tmp/dashtodock
      - cd /tmp/dashtodock && make && make install DESTDIR=/

      # 5. GSConnect
      - git clone "https://github.com/GSConnect/gnome-shell-extension-gsconnect.git" /tmp/gsconnect
      - cd /tmp/gsconnect && meson setup _build . --prefix=/usr && ninja -C _build install
      # Make GNOME Shell's private Gvc typelib available to the GSConnect daemon
      - echo '/usr/lib/gnome-shell' > /etc/ld.so.conf.d/gnome-shell.conf
      - ldconfig
      - mkdir -p /usr/lib/x86_64-linux-gnu/girepository-1.0
      - '[ -f /usr/lib/gnome-shell/Gvc-1.0.typelib ] && ln -sf /usr/lib/gnome-shell/Gvc-1.0.typelib /usr/lib/x86_64-linux-gnu/girepository-1.0/Gvc-1.0.typelib'
      # Make libgvc.so resolvable from a standard library search path
      - ln -sf /usr/lib/gnome-shell/libgvc.so /usr/lib/x86_64-linux-gnu/libgvc.so
      - ldconfig

      # 6. Lock Keys
      - git clone "https://github.com/kazysmaster/gnome-shell-extension-lockkeys.git" /usr/share/gnome-shell/extensions/lockkeys@vaina.lt

      # 7. Wallpaper Carousel
      - git clone --depth 1 "https://github.com/SpiritualRose/wallpaper-carousel.git" /tmp/wallpaper-carousel
      - WCUUID=$(jq -r '.uuid' /tmp/wallpaper-carousel/metadata.json) && [ -n "$WCUUID" ] && rm -rf "/usr/share/gnome-shell/extensions/$WCUUID" && mv /tmp/wallpaper-carousel "/usr/share/gnome-shell/extensions/$WCUUID"

      # Compile gsettings schemas for all installed extensions
      - glib-compile-schemas /usr/share/glib-2.0/schemas
      - for d in /usr/share/gnome-shell/extensions/*/schemas; do [ -d "$d" ] && glib-compile-schemas "$d"; done

  - name: install-sweet-aesthetics
    type: shell
    commands:
      - mkdir -p /usr/share/themes /usr/share/icons

      # 1. Fetch & Install the Core Sweet GTK Theme
      - wget -nv --tries=5 --timeout=60 -O /tmp/sweet-theme.tar.gz "https://codeload.github.com/EliverLara/Sweet/tar.gz/refs/heads/master"
      - mkdir -p /usr/share/themes/Sweet
      - tar -xzf /tmp/sweet-theme.tar.gz -C /usr/share/themes/Sweet --strip-components=1

      # 2. Fetch & Install Candy Icons
      - wget -nv --tries=5 --timeout=60 -O /tmp/candy-icons.tar.gz "https://codeload.github.com/EliverLara/candy-icons/tar.gz/refs/heads/master"
      - mkdir -p /usr/share/icons/candy-icons
      - tar -xzf /tmp/candy-icons.tar.gz -C /usr/share/icons/candy-icons --strip-components=1

      # 3. Fetch & Install Sweet Cursor pack (release asset name varies)
      - wget -nv --tries=5 --timeout=60 -O /tmp/sweet-cursors.tar.xz "https://github.com/EliverLara/Sweet/releases/latest/download/Sweet-cursors.tar.xz" || true
      - if [ -s /tmp/sweet-cursors.tar.xz ]; then tar -xJf /tmp/sweet-cursors.tar.xz -C /usr/share/icons/; else echo "Sweet cursors not available, skipping"; fi

  - name: add-vanilla-backgrounds
    type: includes
    includes:
      - modules/55-vanilla-backgrounds.yml

  - name: system-cleanup
    type: shell
    commands:
      - apt-get autoremove -y
      - apt-get clean
      - rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*

  # Vib template modules
  - name: set-image-name-abroot
    type: includes
    includes:
      - modules/80-set-image-abroot-config.yml

  - name: cleanup
    type: shell
    commands:
    - apt-get autoremove -y
    - apt-get clean
    - lpkg --lock

  - name: fsguard
    type: fsguard
    CustomFsGuard: false
    FsGuardLocation: "/usr/sbin/FsGuard"
    GenerateKey: true
    FilelistPaths: ["/usr/bin"]
    modules:
      - name: remove-prev-fsguard
        type: shell
        commands:
          - rm -rf /FsGuard
          - rm -f ./minisign.pub ./minisign.key
          - chmod +x /usr/sbin/init

  - name: cleanup2
    type: shell
    commands:
      - rm -rf /tmp/*
      - rm -rf /var/tmp/*
